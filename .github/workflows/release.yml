name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build release artifacts
        run: |
          chmod +x scripts/package-release.sh scripts/make-icon.swift
          scripts/package-release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/IRSVerb-${VERSION}-macos.zip" \
            "dist/IRSVerb-${VERSION}-macos.zip.sha256" \
            "dist/IRSVerb-${VERSION}.dmg" \
            "dist/IRSVerb-${VERSION}.dmg.sha256" \
            --title "IRSVerb $VERSION" \
            --generate-notes
