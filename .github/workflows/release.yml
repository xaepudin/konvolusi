name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build release artifacts
        run: |
          chmod +x scripts/package-release.sh scripts/make-icon.swift
          scripts/package-release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_ARGS=(--generate-notes)
          if [[ -f "docs/release-notes/${VERSION}.md" ]]; then
            NOTES_ARGS=(--notes-file "docs/release-notes/${VERSION}.md")
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/Konvolusi-${VERSION}-macos.zip" \
            "dist/Konvolusi-${VERSION}-macos.zip.sha256" \
            "dist/Konvolusi-${VERSION}.dmg" \
            "dist/Konvolusi-${VERSION}.dmg.sha256" \
            --title "Konvolusi $VERSION" \
            "${NOTES_ARGS[@]}"
